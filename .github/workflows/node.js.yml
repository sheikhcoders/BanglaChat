# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/about/releases/

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.7

    - name: Install pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@feaa9040e632e8f9582a96a4a15993888357a701 # v4.0.0
      with:
        version: 9

    - name: Use Node.js ${{ matrix.node-version }}
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.2
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: pnpm install --no-frozen-lockfile

    - name: Build
      if: hashFiles('package.json') != ''
      run: pnpm run build --if-present

    - name: Test
      if: hashFiles('package.json') != ''
      run: pnpm test
