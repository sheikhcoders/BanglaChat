# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect package manifest
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -f "pnpm-lock.yaml" ]; then
              echo "cache=pnpm" >> $GITHUB_OUTPUT
            elif [ -f "package-lock.json" ]; then
              echo "cache=npm" >> $GITHUB_OUTPUT
            elif [ -f "yarn.lock" ]; then
              echo "cache=yarn" >> $GITHUB_OUTPUT
            fi
          else
            if [ -d "src" ] || [ -d "app" ] || [ -d "pages" ] || [ -d "components" ]; then
              echo "::error::Source directories found but no package.json"
              exit 1
            fi
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.cache }}

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.cache }}" = "pnpm" ]; then
            pnpm install
          elif [ "${{ steps.detect.outputs.cache }}" = "yarn" ]; then
            yarn install
          else
            npm ci
          fi

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm test
