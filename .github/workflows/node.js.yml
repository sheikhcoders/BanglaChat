# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SENTINEL: Enforce global least privilege permissions
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # SENTINEL: Prevent resource exhaustion from hanging jobs
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pin actions to immutable SHAs for security
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL: Conditional caching prevents failure in uninitialized repository
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    # SENTINEL: Guard steps with manifest check to handle uninitialized state
    - run: npm ci
      if: hashFiles('package-lock.json') != ''
    - run: npm run build --if-present
      if: hashFiles('package.json') != ''
    - run: npm test
      if: hashFiles('package.json') != ''
