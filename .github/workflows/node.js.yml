# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/SECURITY.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/SECURITY.md'
      - '.Jules/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          echo "frozen=--frozen-lockfile" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          echo "frozen=--frozen-lockfile" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          echo "frozen=" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          echo "frozen=" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "manager=" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Install pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v4.1.0
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-package-manager.outputs.manager || '' }}

    - name: Install dependencies
      if: steps.detect-package-manager.outputs.manager != ''
      run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }} ${{ steps.detect-package-manager.outputs.frozen }}

    - name: Build
      if: steps.detect-package-manager.outputs.manager != ''
      run: |
        if [ "${{ steps.detect-package-manager.outputs.manager }}" = "npm" ]; then
          npm run build --if-present
        else
          ${{ steps.detect-package-manager.outputs.manager }} run build
        fi

    - name: Test
      if: steps.detect-package-manager.outputs.manager != ''
      run: ${{ steps.detect-package-manager.outputs.manager }} test
