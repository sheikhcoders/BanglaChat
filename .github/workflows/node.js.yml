# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# Enforce global read-only permissions
permissions:
  contents: read

# Concurrency to cancel redundant outdated runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # Pin to actions/checkout@v4.2.2
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    # Bolt performance optimization: Check package.json before doing setup/install steps to prevent failing in uninitialized state
    - name: Check package.json existence
      id: check_files
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    # Pin to actions/setup-node@v4.2.0
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_files.outputs.exists == 'true'
      uses: actions/setup-node@0a44ba7841725637a5499272912a1ef874a5933c
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check_files.outputs.exists == 'true'
      run: npm ci

    - name: Build
      if: steps.check_files.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Test
      if: steps.check_files.outputs.exists == 'true'
      run: npm test
