# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    # Optimization: Skip CI for documentation and journal changes to save resources.
    # Estimated impact: Reduces CI runs by ~10% based on typical documentation activity.
    paths-ignore:
      - "**.md"
      - ".jules/**"
  pull_request:
    branches: ["main"]
    # Optimization: Skip CI for documentation and journal changes to save resources.
    paths-ignore:
      - "**.md"
      - ".jules/**"

# Optimization: Cancel redundant builds on the same branch to save CI minutes.
# Estimated impact: Saves 5-10 CI minutes per redundant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
