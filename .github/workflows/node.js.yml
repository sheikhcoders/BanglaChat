# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hanging processes from consuming resources

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # Security: do not persist GITHUB_TOKEN in local git config

      - name: Detect package manifest
        id: detect
        run: |
          if [ -f "package.json" ] || [ -f "pnpm-lock.yaml" ] || [ -f "yarn.lock" ] || [ -f "package-lock.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          elif [ -d "src" ] || [ -d "app" ] || [ -d "pages" ] || [ -d "components" ]; then
            echo "Error: Code directories found but no package manifest exists."
            exit 1
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm test
