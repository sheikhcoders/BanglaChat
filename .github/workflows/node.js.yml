name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect environment
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -f "pnpm-lock.yaml" ]; then
              echo "cache=pnpm" >> $GITHUB_OUTPUT
              echo "runner=pnpm" >> $GITHUB_OUTPUT
              echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
            elif [ -f "yarn.lock" ]; then
              echo "cache=yarn" >> $GITHUB_OUTPUT
              echo "runner=yarn" >> $GITHUB_OUTPUT
              echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT
            elif [ -f "package-lock.json" ]; then
              echo "cache=npm" >> $GITHUB_OUTPUT
              echo "runner=npm" >> $GITHUB_OUTPUT
              echo "install=npm ci" >> $GITHUB_OUTPUT
            else
              echo "cache=" >> $GITHUB_OUTPUT
              echo "runner=pnpm" >> $GITHUB_OUTPUT
              echo "install=pnpm install" >> $GITHUB_OUTPUT
            fi
          elif [ -d "src" ] || [ -d "app" ] || [ -d "pages" ] || [ -d "components" ]; then
            echo "Error: Code directories found but no package.json exists."
            exit 1
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "cache=" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.found == 'true' && steps.detect.outputs.runner == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.cache }}

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: ${{ steps.detect.outputs.install }}

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.runner }}" = "pnpm" ]; then
            pnpm run build --if-present
          elif [ "${{ steps.detect.outputs.runner }}" = "yarn" ]; then
            yarn build --if-present || true
          else
            npm run build --if-present
          fi

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.runner }}" = "pnpm" ]; then
            pnpm test
          elif [ "${{ steps.detect.outputs.runner }}" = "yarn" ]; then
            yarn test
          else
            npm test
          fi
