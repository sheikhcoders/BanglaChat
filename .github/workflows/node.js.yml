# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore: [".jules/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: [".jules/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Detect PM
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "m=pnpm" >> $GITHUB_OUTPUT; echo "c=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then echo "m=yarn" >> $GITHUB_OUTPUT; echo "c=yarn" >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then echo "m=npm" >> $GITHUB_OUTPUT; echo "c=npm" >> $GITHUB_OUTPUT
          else echo "m=npm" >> $GITHUB_OUTPUT; echo "c=" >> $GITHUB_OUTPUT; fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.m == 'pnpm'
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.pm.outputs.c }}
      - run: ${{ steps.pm.outputs.m }} install
        if: hashFiles('package.json') != ''
      - run: ${{ steps.pm.outputs.m }} run build --if-present
        if: hashFiles('package.json') != ''
      - run: ${{ steps.pm.outputs.m }} test
        if: hashFiles('package.json') != ''
