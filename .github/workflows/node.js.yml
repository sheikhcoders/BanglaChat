# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # Optimize: Ignore documentation and journal changes to save CI compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    # Optimize: Ignore documentation and journal changes to save CI compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'

# Optimize: Cancel in-progress runs for same workflow to save CI compute
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Optimize: Only enable caching if a lockfile exists to prevent workflow failure
        cache: ${{ (hashFiles('package-lock.json') != '' && 'npm') || (hashFiles('yarn.lock') != '' && 'yarn') || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm') || '' }}
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    - name: Build source
      if: hashFiles('package.json') != ''
      run: npm run build --if-present
    - name: Run tests
      if: hashFiles('package.json') != ''
      run: npm test
