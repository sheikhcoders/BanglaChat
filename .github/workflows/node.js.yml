# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'

# Prevent redundant workflows by canceling in-progress runs on same-branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Enforce secure global read-only permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2 # pinned to actions/checkout@v4.2.2
      with:
        persist-credentials: false

    - name: Check package.json existence
      id: check-package-json
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Package.json exists, running build/test suite."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "package.json not found. Uninitialized repository, skipping steps."
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check-package-json.outputs.exists == 'true'
      uses: actions/setup-node@v4.2.0 # pinned to actions/setup-node@v4.2.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check-package-json.outputs.exists == 'true'
      run: npm ci

    - name: Build
      if: steps.check-package-json.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Test
      if: steps.check-package-json.outputs.exists == 'true'
      run: npm test
