# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.jules/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.jules/**', '.github/PULL_REQUEST_TEMPLATE.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Detect package manager
      id: detect
      run: echo "manager=$( [ -f pnpm-lock.yaml ] && echo pnpm || echo npm )" >> $GITHUB_OUTPUT
    - if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: ${{ (hashFiles('package-lock.json') != '' || hashFiles('pnpm-lock.yaml') != '') && steps.detect.outputs.manager || '' }}
    - if: hashFiles('package.json') != ''
      run: |
        MANAGER=${{ steps.detect.outputs.manager }}
        [[ $MANAGER == "pnpm" ]] && pnpm install || npm ci
        $MANAGER run build --if-present
        $MANAGER test
