# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2 # 11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Check package.json existence
      id: check_files
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_files.outputs.exists == 'true'
      uses: actions/setup-node@v4.2.0 # 1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check_files.outputs.exists == 'true'
      run: npm ci

    - name: Build code
      if: steps.check_files.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Run tests
      if: steps.check_files.outputs.exists == 'true'
      run: npm test
