# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package-lock.json" ] || [ -f "${{ github.workspace }}/package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          exit 0
        fi
    - name: Install pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ (hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '') && steps.detect-package-manager.outputs.manager || '' }}
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-package-manager.outputs.manager }}" == "pnpm" ]; then
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
        elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "yarn" ]; then
          yarn install --frozen-lockfile
        else
          npm ci
        fi
    - name: Build
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-package-manager.outputs.manager }}" == "pnpm" ]; then
          pnpm run build --if-present
        elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "yarn" ]; then
          yarn run build --if-present
        else
          npm run build --if-present
        fi
    - name: Test
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-package-manager.outputs.manager }}" == "pnpm" ]; then
          pnpm test
        elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "yarn" ]; then
          yarn test
        else
          npm test
        fi
