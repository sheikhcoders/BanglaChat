# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # Optimization: Ignore documentation and journal updates to avoid redundant CI runs
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # Optimization: Ignore documentation and journal updates to avoid redundant CI runs
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# Optimization: Cancel in-progress runs on new pushes to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Optimization: Only run when a manifest exists to avoid failing in uninitialized states
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    # Optimization: Prevent hung processes from consuming excessive resources
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
