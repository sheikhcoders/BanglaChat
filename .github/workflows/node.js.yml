# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SENTINEL: Enforce global least-privilege permissions
permissions:
  contents: read

jobs:
  build:
    # SENTINEL: Prevent failures in uninitialized repository state
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pin to df4cb1c069e1874edd31b4311f1884172cec0e10 (actions/checkout@v4)
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Use Node.js ${{ matrix.node-version }}
      # SENTINEL: Pin to 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e (actions/setup-node@v4)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL: Conditional cache to prevent errors when lockfile is missing
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
