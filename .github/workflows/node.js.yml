# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# BOLT: Exclude documentation-only updates from CI triggers to save compute resources.
# SENTINEL: Enforce global least privilege.
permissions:
  contents: read

jobs:
  build:
    # SENTINEL: Prevent CI failures in uninitialized repository state.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    # SENTINEL: Prevent resource exhaustion from hanging processes.
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pin actions to verified SHAs to prevent supply chain attacks.
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.2
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL: Only enable caching if lockfile exists to avoid setup-node errors.
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
