# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect environment
        id: detect
        run: |
          [ -f "package.json" ] && echo found=true >> $GITHUB_OUTPUT || echo found=false >> $GITHUB_OUTPUT
          [ -f "pnpm-lock.yaml" ] && echo cache=pnpm >> $GITHUB_OUTPUT || echo cache=npm >> $GITHUB_OUTPUT
          ([ -f "pnpm-lock.yaml" ] || [ -f "package-lock.json" ] || [ -f "yarn.lock" ]) || echo cache= >> $GITHUB_OUTPUT

      - name: Setup pnpm
        if: steps.detect.outputs.cache == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.cache }}

      - name: CI Steps
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.cache }}" == "pnpm" ]; then
            pnpm install --frozen-lockfile && pnpm run build --if-present && pnpm test
          else
            npm ci && npm run build --if-present && npm test
          fi
