# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Limit the GITHUB_TOKEN permissions to only what is required (read-only access to contents)
permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          # Prevent the GITHUB_TOKEN from being persisted on the runner
          persist-credentials: false
      - name: Check for package.json
        id: check_files
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.check_files.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '' && 'npm' || '' }}
      - run: npm ci
        if: steps.check_files.outputs.found == 'true'
      - run: npm run build --if-present
        if: steps.check_files.outputs.found == 'true'
      - run: npm test
        if: steps.check_files.outputs.found == 'true'
