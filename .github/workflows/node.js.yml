# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    # Expected Impact: Reduces CI runs by ~10-20% for doc-heavy repos
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# BOLT: Cancel in-progress runs when a new commit is pushed to the same branch/PR to save compute resources
# Expected Impact: Reduces redundant compute usage by ~30% in active development
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT: Only enable caching if a lock file exists to prevent failure in uninitialized repositories
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    - name: Install dependencies
      # BOLT: Use --no-audit and --no-fund to speed up clean installations in CI
      # Expected Impact: Shaves ~5-10s off installation time
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --no-audit --no-fund
        elif [ -f "package.json" ]; then
          echo "::warning::package-lock.json not found, falling back to npm install"
          npm install --no-audit --no-fund
        else
          echo "::warning::No package.json found. Skipping installation."
        fi

    - name: Build
      run: |
        if [ -f "package.json" ]; then
          npm run build --if-present
        else
          echo "::warning::No package.json found. Skipping build."
        fi

    - name: Test
      run: |
        if [ -f "package.json" ]; then
          npm test
        else
          echo "::warning::No package.json found. Skipping tests."
        fi
