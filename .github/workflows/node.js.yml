# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# BOLT: Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # BOLT: Avoid running CI in uninitialized repository states (missing package.json)
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT: Enable caching for faster subsequent runs.
        # Note: actions/setup-node@v4 requires a lockfile to be present for caching to work.
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
