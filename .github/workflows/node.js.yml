# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    # Bolt: Ignore non-code changes to save Actions minutes (~5-10% saving)
    paths-ignore:
      - ".jules/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    # Bolt: Ignore non-code changes to save Actions minutes (~5-10% saving)
    paths-ignore:
      - ".jules/**"
      - "**.md"

# Bolt: Cancel in-progress runs on the same branch to save resources (~30% saving)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Bolt: Skip job if no package.json exists to save 100% of Actions minutes for empty repos
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    # Bolt: Prevent runaway processes from consuming excessive resources
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get npm cache directory
        id: npm-cache-dir
        if: hashFiles('package.json') != ''
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        if: hashFiles('package.json') != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (clean)
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json') != ''
        run: npm ci

      - name: Install dependencies (fallback)
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json', 'npm-shrinkwrap.json') == ''
        run: npm install

      - run: npm run build --if-present
      - run: npm run test --if-present
