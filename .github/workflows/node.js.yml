# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# BOLT: cancel-in-progress: true saves compute by terminating redundant runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # BOLT: Skip job in uninitialized repos (no package.json) to prevent guaranteed failures and compute waste
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT: prevent setup-node failure when lockfile is missing in sparse repo
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
