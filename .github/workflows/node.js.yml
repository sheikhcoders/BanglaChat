# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT OPTIMIZATION: Skip documentation-only changes to save compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT OPTIMIZATION: Skip documentation-only changes to save compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'

# BOLT OPTIMIZATION: Save compute by cancelling outdated runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT OPTIMIZATION: Only cache if lockfile exists to prevent fatal errors
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    # BOLT OPTIMIZATION: Check for package.json to handle uninitialized state gracefully
    - name: Check for package.json
      id: check_package
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Install dependencies
      if: steps.check_package.outputs.exists == 'true'
      run: npm ci

    - name: Build
      if: steps.check_package.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Test
      if: steps.check_package.outputs.exists == 'true'
      run: npm test
