# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".jules/**"
      - "SECURITY.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".jules/**"
      - "SECURITY.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.detect-state.outputs.should-run }}
      cache_type: ${{ steps.detect-state.outputs.cache_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect Repository State
        id: detect-state
        run: |
          if [ -f "package.json" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            if [ -f "package-lock.json" ]; then
              echo "cache_type=npm" >> $GITHUB_OUTPUT
            elif [ -f "yarn.lock" ]; then
              echo "cache_type=yarn" >> $GITHUB_OUTPUT
            elif [ -f "pnpm-lock.yaml" ]; then
              echo "cache_type=pnpm" >> $GITHUB_OUTPUT
            else
              echo "cache_type=" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # If no package.json, check if there's any actual code to build/test
          # Exclude hidden files, markdown, and CI/agent metadata
          if find . -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" -o -name "*.json" -o -name "*.css" \) -not -path "./.git/*" -not -path "./.jules/*" -not -path "./.github/*" | grep -q .; then
            echo "::error::package.json is missing but source code files are present! CI must fail to prevent silent bypass."
            exit 1
          fi

          echo "::notice::Repository is uninitialized and contains no code. Skipping build matrix to save resources."
          echo "should-run=false" >> $GITHUB_OUTPUT
          echo "cache_type=" >> $GITHUB_OUTPUT

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ needs.pre-check.outputs.cache_type }}

      - name: Install dependencies
        run: npm ci

      - name: Build code
        run: npm run build --if-present

      - name: Run tests
        run: npm test
