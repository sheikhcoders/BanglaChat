# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Hardening: Set restrictive default permissions
permissions:
  contents: read

# Hardening: Manage redundant runs securely
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Hardening: Add timeout to prevent resource exhaustion
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - # Hardening: Disable credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect package manifest
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.found == 'true' && 'npm' || '' }}
      - run: npm ci
        if: steps.detect.outputs.found == 'true'
      - run: npm run build --if-present
        if: steps.detect.outputs.found == 'true'
      - run: npm test
        if: steps.detect.outputs.found == 'true'
