name: Node.js CI

on:
  push:
    branches: ["main"]
    # ⚡ Bolt: Skip CI when only journals/documentation are updated
    paths-ignore:
      - ".jules/**"
  pull_request:
    branches: ["main"]
    # ⚡ Bolt: Skip CI when only journals/documentation are updated
    paths-ignore:
      - ".jules/**"

# ⚡ Bolt: Cancel in-progress runs for the same workflow/branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      # ⚡ Bolt: Check if repo is initialized to skip CI and save resources
      - name: Bootstrap Guard
        id: guard
        run: echo "initialized=$( [ -f package.json ] && echo true || echo false )" >> $GITHUB_OUTPUT
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.guard.outputs.initialized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # ⚡ Bolt: Only enable cache if package-lock.json exists, otherwise setup-node fails
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: npm ci
        if: steps.guard.outputs.initialized == 'true'
      - run: npm run build --if-present
        if: steps.guard.outputs.initialized == 'true'
      - run: npm test
        if: steps.guard.outputs.initialized == 'true'
