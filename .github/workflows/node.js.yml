# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # ⚡ Bolt: Skip CI runs for documentation/journal changes to save compute.
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'
  pull_request:
    branches: [ "main" ]
    # ⚡ Bolt: Skip CI runs for documentation/journal changes to save compute.
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'

jobs:
  build:
    # ⚡ Bolt: Prevent redundant failures in uninitialized repositories.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "install=install --frozen-lockfile" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "install=install --frozen-lockfile" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "install=ci" >> $GITHUB_OUTPUT
          exit 0
        else
          # ⚡ Bolt: Default to pnpm for faster installation if no lockfile exists.
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "install=install" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Setup pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-package-manager.outputs.manager }}

    - name: Install dependencies
      run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.install }}

    - name: Build
      run: ${{ steps.detect-package-manager.outputs.manager }} run build --if-present

    - name: Test
      run: ${{ steps.detect-package-manager.outputs.manager }} test
