# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT OPTIMIZATION: Skip CI for documentation-only changes to save compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT OPTIMIZATION: Skip CI for documentation-only changes to save compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'

# BOLT OPTIMIZATION: Cancel in-progress runs when a new push is made to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT OPTIMIZATION: Conditional caching to prevent errors in uninitialized repositories
        cache: ${{ (hashFiles('package-lock.json') != '' && 'npm') || (hashFiles('yarn.lock') != '' && 'yarn') || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm') || '' }}
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: npm ci
    - name: Build
      if: hashFiles('package.json') != ''
      run: npm run build --if-present
    - name: Test
      if: hashFiles('package.json') != ''
      run: npm test
