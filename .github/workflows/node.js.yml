# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs when a new push is made to the same branch
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write # Required to save the dependency cache

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "Unable to determine package manager"
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
    - name: Install pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      run: corepack enable pnpm
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.detect-package-manager.outputs.skip != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-package-manager.outputs.manager }}
    - name: Install dependencies
      if: steps.detect-package-manager.outputs.skip != 'true'
      run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
    - name: Build
      if: steps.detect-package-manager.outputs.skip != 'true'
      run: ${{ steps.detect-package-manager.outputs.manager }} run build --if-present
    - name: Test
      if: steps.detect-package-manager.outputs.skip != 'true'
      run: ${{ steps.detect-package-manager.outputs.manager }} test
