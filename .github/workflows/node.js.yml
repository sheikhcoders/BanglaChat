# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Explicitly declare least-privilege permissions for the workflow
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check package.json existence
      id: check-package-json
      run: |
        if [ -f "package.json" ]; then
          echo "has_package=true" >> $GITHUB_OUTPUT
        else
          echo "has_package=false" >> $GITHUB_OUTPUT
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check-package-json.outputs.has_package == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      if: steps.check-package-json.outputs.has_package == 'true'
      run: npm ci
    - name: Build project
      if: steps.check-package-json.outputs.has_package == 'true'
      run: npm run build --if-present
    - name: Run tests
      if: steps.check-package-json.outputs.has_package == 'true'
      run: npm test
