# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Security: Enforce least privilege - default to read-only access for repository tokens
permissions:
  contents: read

jobs:
  build:
    # Security: Limit execution duration to prevent runaway processes / resource exhaustion DoS
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # Security: Disable credential persistence to prevent token exposure to untrusted code/build scripts
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - if: hashFiles('package.json') != ''
      run: npm ci
    - if: hashFiles('package.json') != ''
      run: npm run build --if-present
    - if: hashFiles('package.json') != ''
      run: npm test
