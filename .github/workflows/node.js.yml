# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.jules/**'

# Cancel in-progress runs when a new commit is pushed to save compute resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Check package.json existence
      id: check_files
      run: echo "has_pkg=$(if [ -f package.json ]; then echo 'true'; else echo 'false'; fi)" >> $GITHUB_OUTPUT
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_files.outputs.has_pkg == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      if: steps.check_files.outputs.has_pkg == 'true'
      run: npm ci
    - name: Build
      if: steps.check_files.outputs.has_pkg == 'true'
      run: npm run build --if-present
    - name: Test
      if: steps.check_files.outputs.has_pkg == 'true'
      run: npm test
