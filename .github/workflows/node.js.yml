# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "**.md"

# Set top-level permissions to read-only for the GITHUB_TOKEN to follow the principle of least privilege
permissions:
  contents: read

jobs:
  build:
    # Only run if a package.json exists to avoid CI failures in empty repositories
    if: hashFiles('package.json') != ''
    # Enforce a timeout to prevent runaway processes and potential DoS
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Security hardening: do not persist credentials to prevent token leakage in subsequent steps
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
