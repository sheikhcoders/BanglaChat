# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.jules/**'

# Cancel in-progress runs for the same branch to save runner compute time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4

    # Check if package.json exists to prevent build failures in uninitialized repositories
    - name: Check package.json existence
      id: check_package_json
      run: |
        if [ -f "package.json" ]; then
          echo "has_package_json=true" >> $GITHUB_OUTPUT
        else
          echo "has_package_json=false" >> $GITHUB_OUTPUT
          echo "No package.json found. Skipping npm steps."
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_package_json.outputs.has_package_json == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
      if: steps.check_package_json.outputs.has_package_json == 'true'

    - run: npm run build --if-present
      if: steps.check_package_json.outputs.has_package_json == 'true'

    - run: npm test
      if: steps.check_package_json.outputs.has_package_json == 'true'
