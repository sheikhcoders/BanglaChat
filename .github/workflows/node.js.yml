# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Optimization: Cancel redundant runs on the same branch to save CI resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      # Optimization: Detect package manager to support faster tools (pnpm) and
      # skip execution in uninitialized repositories to save CI minutes.
      - name: Detect package manager
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -f "pnpm-lock.yaml" ]; then
              echo "manager=pnpm" >> $GITHUB_OUTPUT
              echo "cache=pnpm" >> $GITHUB_OUTPUT
            elif [ -f "yarn.lock" ]; then
              echo "manager=yarn" >> $GITHUB_OUTPUT
              echo "cache=yarn" >> $GITHUB_OUTPUT
            else
              echo "manager=npm" >> $GITHUB_OUTPUT
              echo "cache=npm" >> $GITHUB_OUTPUT
            fi
          elif [ -d "src" ] || [ -d "app" ] || [ -d "pages" ] || [ -d "components" ]; then
            echo "Error: Source directories found but no package.json"
            exit 1
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup pnpm
        if: steps.detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.cache }}
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.manager }}" == "npm" ]; then
            npm ci
          else
            ${{ steps.detect.outputs.manager }} install
          fi
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: ${{ steps.detect.outputs.manager == 'npm' && 'npm' || steps.detect.outputs.manager }} run build --if-present
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: ${{ steps.detect.outputs.manager == 'npm' && 'npm' || steps.detect.outputs.manager }} test
