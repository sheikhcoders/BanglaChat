# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/about/releases/

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check_files
        run: echo "found=$(test -f package.json && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.check_files.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '' && 'npm' || '' }}
      - run: npm ci
        if: steps.check_files.outputs.found == 'true'
      - run: npm run build --if-present
        if: steps.check_files.outputs.found == 'true'
      - run: npm test
        if: steps.check_files.outputs.found == 'true'
