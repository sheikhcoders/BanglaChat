# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/about/releases/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SENTINEL: Enforce global read-only permissions to minimize the impact of any compromised action or dependency.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # SENTINEL: Added 15-minute timeout to prevent runaway jobs from consuming excessive compute resources.
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pinning actions to verified SHAs prevents supply chain attacks if the action repository is compromised.
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL: Use conditional caching to prevent failures in uninitialized repositories without a lock file.
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
