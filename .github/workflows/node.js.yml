# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # ⚡ Bolt: Skip CI for documentation and journal updates to save compute
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # ⚡ Bolt: Skip CI for documentation and journal updates to save compute
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# ⚡ Bolt: Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ⚡ Bolt: Prevent job failure in uninitialized repositories
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # ⚡ Bolt: Only enable caching if a lockfile exists to avoid setup-node fatal errors
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - name: Install dependencies
      # ⚡ Bolt: Fallback to npm install if package-lock.json is missing for resilience
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    - run: npm run build --if-present
    - run: npm test
