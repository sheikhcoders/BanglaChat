# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - 'SECURITY.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install pnpm
      # Optimization: Use pnpm as the standard package manager for faster dependency resolution
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

    - name: Install dependencies
      # Performance: Only run install if manifest exists. Use --no-frozen-lockfile to handle
      # uninitialized state or missing lockfiles without breaking the build.
      if: hashFiles('pnpm-lock.yaml') != '' || hashFiles('package.json') != ''
      run: pnpm install --no-frozen-lockfile

    - name: Build
      if: hashFiles('package.json') != ''
      run: pnpm run build --if-present

    - name: Test
      if: hashFiles('package.json') != ''
      run: pnpm test
