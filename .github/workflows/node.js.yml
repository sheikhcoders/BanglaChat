# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "pnpm-lock.yaml" ]; then echo "manager=pnpm" >> $GITHUB_OUTPUT;
        elif [ -f "yarn.lock" ]; then echo "manager=yarn" >> $GITHUB_OUTPUT;
        else echo "manager=npm" >> $GITHUB_OUTPUT; fi
    - name: Install pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ (hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '') && steps.detect-package-manager.outputs.manager || '' }}
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: |
        if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile;
        elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
        elif [ -f package-lock.json ]; then npm ci;
        else npm install; fi
    - name: Build
      if: hashFiles('package.json') != ''
      run: npm run build --if-present
    - name: Test
      if: hashFiles('package.json') != ''
      run: npm test
