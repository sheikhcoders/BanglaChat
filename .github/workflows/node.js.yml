# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Detect package manifest
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -f "pnpm-lock.yaml" ]; then
              echo "cache=pnpm" >> $GITHUB_OUTPUT
              echo "runner=pnpm" >> $GITHUB_OUTPUT
            elif [ -f "package-lock.json" ]; then
              echo "cache=npm" >> $GITHUB_OUTPUT
              echo "runner=npm" >> $GITHUB_OUTPUT
            elif [ -f "yarn.lock" ]; then
              echo "cache=yarn" >> $GITHUB_OUTPUT
              echo "runner=yarn" >> $GITHUB_OUTPUT
            else
              echo "cache=" >> $GITHUB_OUTPUT
              echo "runner=npm" >> $GITHUB_OUTPUT
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Install pnpm
        if: steps.detect.outputs.found == 'true' && steps.detect.outputs.cache == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect.outputs.cache }}
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ "${{ steps.detect.outputs.cache }}" = "pnpm" ]; then
            pnpm install
          elif [ "${{ steps.detect.outputs.cache }}" = "npm" ]; then
            npm ci
          else
            ${{ steps.detect.outputs.runner }} install
          fi
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: ${{ steps.detect.outputs.runner }} run build --if-present
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: ${{ steps.detect.outputs.runner }} test
