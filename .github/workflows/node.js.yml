# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Declare global permissions as read-only to enforce the principle of least privilege.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Guard against infinite execution loops or resource exhaustion

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      # Pin actions to a specific SHA commit to protect against third-party action mutability / supply-chain attacks.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Check if package.json and associated lockfiles exist to safely run in uninitialized repositories.
      - name: Check package.json existence
        id: check-package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ] || [ -f "yarn.lock" ] || [ -f "pnpm-lock.yaml" ]; then
              echo "cache=npm" >> $GITHUB_OUTPUT
            else
              echo "cache=" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "cache=" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.check-package.outputs.cache }}

      - name: Install dependencies
        if: steps.check-package.outputs.exists == 'true'
        run: npm ci

      - name: Build
        if: steps.check-package.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.check-package.outputs.exists == 'true'
        run: npm test
