# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        persist-credentials: false

    - name: Check package.json existence
      id: check_package
      run: |
        if [ -f "package.json" ]; then
          echo "has_package=true" >> $GITHUB_OUTPUT
        else
          echo "has_package=false" >> $GITHUB_OUTPUT
          echo "package.json not found in uninitialized repository state."
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_package.outputs.has_package == 'true'
      uses: actions/setup-node@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v4.0.3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check_package.outputs.has_package == 'true'
      run: npm ci

    - name: Build project
      if: steps.check_package.outputs.has_package == 'true'
      run: npm run build --if-present

    - name: Run tests
      if: steps.check_package.outputs.has_package == 'true'
      run: npm test
