# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/about/releases/

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      # Pin actions/checkout@v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      # Pin actions/setup-node@v4.2.0
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check package.json existence
      id: check_package_json
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "No package.json found, skipping npm execution steps."
        fi

    - name: Install dependencies
      if: steps.check_package_json.outputs.exists == 'true'
      run: npm ci

    - name: Build project
      if: steps.check_package_json.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Run tests
      if: steps.check_package_json.outputs.exists == 'true'
      run: npm test
