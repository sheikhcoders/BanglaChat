# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save resources.
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT: Skip CI for documentation-only changes to save resources.
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# BOLT: Cancel in-progress runs for the same branch/PR to optimize CI minute usage.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT: Use conditional caching to avoid setup-node failures in repositories without a lockfile.
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    # BOLT: Guard manifest-dependent steps to prevent pipeline failures in uninitialized
    # repositories while providing faster feedback for valid code changes.
    - run: npm ci
      # BOLT: npm ci requires package-lock.json to exist.
      if: hashFiles('package-lock.json') != ''
    - run: npm run build --if-present
      if: hashFiles('package.json') != ''
    - run: npm test
      if: hashFiles('package.json') != ''
