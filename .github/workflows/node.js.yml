# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'

jobs:
  build:
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "Unable to determine package manager"
          exit 1
        fi

    - name: Install pnpm
      if: steps.detect-package-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-package-manager.outputs.manager }}

    - name: Install dependencies
      run: |
        if [ "${{ steps.detect-package-manager.outputs.manager }}" == "pnpm" ] && [ -f pnpm-lock.yaml ]; then
          pnpm install --frozen-lockfile
        elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "npm" ] && [ -f package-lock.json ]; then
          npm ci
        elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "yarn" ] && [ -f yarn.lock ]; then
          yarn install --frozen-lockfile
        else
          ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        fi

    - name: Build
      run: ${{ steps.detect-package-manager.outputs.manager }} run build --if-present

    - name: Test
      run: ${{ steps.detect-package-manager.outputs.manager }} test
