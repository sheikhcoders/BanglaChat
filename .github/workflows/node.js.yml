# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Check package.json existence
      id: check_package
      run: |
        if [ -f "package.json" ]; then
          echo "has_package=true" >> $GITHUB_OUTPUT
        else
          echo "has_package=false" >> $GITHUB_OUTPUT
          echo "No package.json found. Skipping Node build and test steps."
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_package.outputs.has_package == 'true'
      uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check_package.outputs.has_package == 'true'
      run: npm ci

    - name: Build
      if: steps.check_package.outputs.has_package == 'true'
      run: npm run build --if-present

    - name: Test
      if: steps.check_package.outputs.has_package == 'true'
      run: npm test
