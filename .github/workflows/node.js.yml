# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # Bolt Optimization: Ignore non-code paths to prevent redundant CI workflow triggers
    paths-ignore:
      - '**.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Bolt Optimization: Cancel outdated in-flight CI runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    # Bolt Optimization: Fast-exit if package.json does not exist (uninitialized repo) to save runner time
    - name: Check for package.json
      id: check_files
      run: |
        if [ -f "package.json" ]; then
          echo "has_package_json=true" >> $GITHUB_OUTPUT
        else
          echo "has_package_json=false" >> $GITHUB_OUTPUT
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_files.outputs.has_package_json == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      if: steps.check_files.outputs.has_package_json == 'true'
      run: npm ci
    - name: Build source code
      if: steps.check_files.outputs.has_package_json == 'true'
      run: npm run build --if-present
    - name: Run test suite
      if: steps.check_files.outputs.has_package_json == 'true'
      run: npm test
