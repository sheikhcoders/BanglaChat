# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.jules/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@eef6142db2c5b31f7863f4c78cd09513d2857d6b # v4.2.1
      with:
        persist-credentials: false

    - name: Check package.json existence
      id: check_files
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check_files.outputs.exists == 'true'
      uses: actions/setup-node@0a44ba784172517478202972403d2d0001a096d5 # v4.0.4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.check_files.outputs.exists == 'true'
      run: npm ci

    - name: Build project
      if: steps.check_files.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Run tests
      if: steps.check_files.outputs.exists == 'true'
      run: npm test
