# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/SECURITY.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/SECURITY.md'
      - '.Jules/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Detect package manager
      id: detect-manager
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
        elif [ -f "yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
        else
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
        fi
    - name: Install pnpm
      if: steps.detect-manager.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      if: hashFiles('package.json') != ''
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ (hashFiles('package-lock.json') != '' && 'npm') || (hashFiles('yarn.lock') != '' && 'yarn') || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm') || '' }}
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: ${{ steps.detect-manager.outputs.manager }} ${{ steps.detect-manager.outputs.command }}
    - name: Build
      if: hashFiles('package.json') != ''
      run: ${{ steps.detect-manager.outputs.manager }} run build --if-present
    - name: Test
      if: hashFiles('package.json') != ''
      run: ${{ steps.detect-manager.outputs.manager }} test
