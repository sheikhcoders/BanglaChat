# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  # Explicitly declare read-only permissions for the default GITHUB_TOKEN
  # to prevent unauthorized repository modifications (Principle of Least Privilege).
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Terminate hung processes to mitigate denial-of-service/billing exhaustion

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      # Pin third-party actions to immutable 40-character SHAs to prevent supply-chain attacks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # Avoid storing GITHUB_TOKEN on the runner

      - name: Check package.json existence
        id: check-package-json
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.check-package-json.outputs.exists == 'true'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        if: steps.check-package-json.outputs.exists == 'true'
        run: npm ci

      - name: Build code
        if: steps.check-package-json.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Run tests
        if: steps.check-package-json.outputs.exists == 'true'
        run: npm test
