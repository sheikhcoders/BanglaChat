# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    # Optimization: Skip CI for changes that don't affect the build.
    # Saves ~10-20% Actions minutes by avoiding redundant runs on metadata-only changes.
    paths-ignore:
      - ".jules/**"
  pull_request:
    branches: ["main"]
    # Optimization: Skip CI for changes that don't affect the build.
    paths-ignore:
      - ".jules/**"

# Optimization: Added concurrency control to cancel redundant builds.
# Expected Impact: Saves ~20-40% Actions minutes during active development.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Optimization: Only enable caching if a lock file is present to avoid "lock file not found" errors.
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Build source
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Run tests
        if: hashFiles('package.json') != ''
        run: npm test
