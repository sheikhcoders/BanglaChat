# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/about/releases/

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4

    - name: Detect lockfile
      id: detect-lockfile
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "manager=pnpm" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "manager=npm" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Install pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        run_install: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-lockfile.outputs.exists == 'true' && steps.detect-lockfile.outputs.manager || '' }}

    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-lockfile.outputs.manager }}" == "pnpm" ]; then
          pnpm install
        else
          npm ci
        fi

    - name: Build
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-lockfile.outputs.manager }}" == "pnpm" ]; then
          pnpm run build --if-present
        else
          npm run build --if-present
        fi

    - name: Test
      if: hashFiles('package.json') != ''
      run: |
        if [ "${{ steps.detect-lockfile.outputs.manager }}" == "pnpm" ]; then
          pnpm test
        else
          npm test
        fi
