# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SENTINEL: Enforce global least privilege by restricting token permissions to read-only for repository contents.
permissions:
  contents: read

jobs:
  build:
    # SENTINEL: Skip CI runs in uninitialized repository states to prevent compute waste and failures.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    # SENTINEL: Prevent hung processes from consuming excessive resources.
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pin actions to verified commit SHAs to protect against supply chain attacks.
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.3
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL: Only enable caching if a lockfile exists to prevent terminal errors.
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
