# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ⚡ Performance: Use native hashFiles expression to skip job without runner provisioning overhead.
    # This avoids 20-30s of latency compared to a separate pre-check job.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          # ⚡ Performance: Conditional caching prevents setup-node from failing in repositories without lockfiles.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
