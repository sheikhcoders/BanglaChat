# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - id: det
        run: |
          [ -f package.json ] && echo ok=1 >> $GITHUB_OUTPUT || exit 0
          if [ -f pnpm-lock.yaml ]; then echo m=pnpm >> $GITHUB_OUTPUT; echo c=pnpm >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then echo m=yarn >> $GITHUB_OUTPUT; echo c=yarn >> $GITHUB_OUTPUT
          else echo m=npm >> $GITHUB_OUTPUT; [ -f package-lock.json ] && echo c=npm >> $GITHUB_OUTPUT
          fi
      - if: steps.det.outputs.m == 'pnpm'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.det.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.det.outputs.c }}
      - if: steps.det.outputs.ok == '1'
        run: |
          m=${{ steps.det.outputs.m }}
          [ "$m" == "pnpm" ] && pnpm i --frozen-lockfile || ([ "$m" == "yarn" ] && yarn --frozen-lockfile) || npm ci
          $m run build --if-present && $m test
