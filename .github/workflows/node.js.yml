# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SENTINEL: Enforce global read-only permissions for the GITHUB_TOKEN to follow the principle of least privilege.
permissions:
  contents: read

jobs:
  build:
    # SENTINEL: Added timeout to prevent resource exhaustion from hanging processes.
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL: Pinned to specific SHA for actions/checkout to prevent supply chain attacks via tag hijacking.
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
    - name: Use Node.js ${{ matrix.node-version }}
      # SENTINEL: Pinned to specific SHA for actions/setup-node.
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
