# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=" >> $GITHUB_OUTPUT
            exit 0
          fi
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect-package-manager.outputs.manager || '' }}
      - name: Install dependencies
        run: |
          if [ "${{ steps.detect-package-manager.outputs.manager }}" == "pnpm" ]; then
            pnpm install
          elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "yarn" ]; then
            yarn install
          elif [ "${{ steps.detect-package-manager.outputs.manager }}" == "npm" ]; then
            npm ci
          fi
        if: steps.detect-package-manager.outputs.manager != ''
      - run: ${{ steps.detect-package-manager.outputs.manager }} run build --if-present
        if: steps.detect-package-manager.outputs.manager != ''
      - run: ${{ steps.detect-package-manager.outputs.manager }} test
        if: steps.detect-package-manager.outputs.manager != ''
