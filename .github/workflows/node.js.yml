# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "README.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> $GITHUB_OUTPUT; echo "cmd=install" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> $GITHUB_OUTPUT; echo "cmd=install" >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then echo "pm=npm" >> $GITHUB_OUTPUT; echo "cmd=ci" >> $GITHUB_OUTPUT
          else echo "pm=" >> $GITHUB_OUTPUT; fi
      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect-pm.outputs.pm || '' }}
      - name: Install
        if: steps.detect-pm.outputs.pm != ''
        run: ${{ steps.detect-pm.outputs.pm }} ${{ steps.detect-pm.outputs.cmd }}
      - name: Build
        if: steps.detect-pm.outputs.pm != ''
        run: ${{ steps.detect-pm.outputs.pm }} run build --if-present
      - name: Test
        if: steps.detect-pm.outputs.pm != ''
        run: ${{ steps.detect-pm.outputs.pm }} test
