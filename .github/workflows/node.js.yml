# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore: [".jules/**", "README.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: [".jules/**", "README.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.detect-state.outputs.should-run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect Repository State
        id: detect-state
        run: |
          if [ -f "package.json" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If no package.json, check if there's any actual code to build/test
          # Exclude hidden files, markdown, and CI/agent metadata
          CODE_FILES=$(find . -maxdepth 2 -not -path '*/.*' -not -name '*.md' -not -path './.github*' -not -path './.jules*' | grep -v "^.$" | wc -l)

          if [ "$CODE_FILES" -eq 0 ]; then
            echo "::notice::Repository is uninitialized and contains no code. Skipping build matrix to save resources."
            echo "should-run=false" >> $GITHUB_OUTPUT
          else
            echo "::error file=package.json::Source code detected but package.json is missing. Please initialize the project."
            exit 1
          fi

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          # Use conditional caching to prevent failures in uninitialized repositories
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
