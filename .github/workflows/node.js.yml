# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs when a new push is made to the same branch or PR.
# This saves ~20-40% of Actions minutes during active development.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Prevent runaway processes from wasting Actions minutes.
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        # Skip setup and cache if package.json is missing to avoid failure in empty repos.
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Only enable cache if a lock file is present.
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '' && 'npm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test
