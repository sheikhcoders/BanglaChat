# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# BOLT OPTIMIZATION: paths-ignore for docs and journals to save CI compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'

# SENTINEL HARDENING: Minimal top-level permissions to prevent token misuse
permissions:
  contents: read

# BOLT OPTIMIZATION: Cancel in-progress runs for the same branch to save compute
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # SENTINEL HARDENING: Prevent infinite hang

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # SENTINEL HARDENING: Pinning to full SHAs for security
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ matrix.node-version }}
        # SENTINEL/BOLT: Only enable caching if lockfile exists to prevent fatal error
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    # SENTINEL/BOLT: Guard steps for uninitialized repositories
    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: npm ci

    - name: Build
      if: hashFiles('package.json') != ''
      run: npm run build --if-present

    - name: Test
      if: hashFiles('package.json') != ''
      run: npm test
