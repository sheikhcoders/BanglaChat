# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    # Optimization: Skip CI when only internal agent documentation is updated
    paths-ignore:
      - ".jules/**"
  pull_request:
    branches: ["main"]
    # Optimization: Skip CI when only internal agent documentation is updated
    paths-ignore:
      - ".jules/**"

# Optimization: Cancel redundant runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Optimization: Prevent hung processes from wasting runner time
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Optimization: Only attempt caching if a lockfile exists to avoid initialization overhead
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install dependencies
        # Optimization: Only run if lockfile exists to avoid failure in uninitialized repositories
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Build
        # Optimization: Only run if package.json exists
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Test
        # Optimization: Only run if package.json exists
        if: hashFiles('package.json') != ''
        run: npm test
