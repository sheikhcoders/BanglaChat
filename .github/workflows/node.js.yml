# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # BOLT: Ignore documentation changes to save CI compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # BOLT: Ignore documentation changes to save CI compute resources
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# BOLT: Cancel in-progress runs for the same PR/branch to save compute
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # BOLT: Conditional caching to avoid errors in uninitialized repositories
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - name: Install dependencies
      # BOLT: Skip if package.json is missing to save compute and avoid failures
      if: hashFiles('package.json') != ''
      run: npm ci
    - name: Build
      # BOLT: Skip if package.json is missing
      if: hashFiles('package.json') != ''
      run: npm run build --if-present
    - name: Test
      # BOLT: Skip if package.json is missing
      if: hashFiles('package.json') != ''
      run: npm test
