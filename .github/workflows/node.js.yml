# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check package.json existence
      id: check-files
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.check-files.outputs.exists == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Only use cache if a lockfile exists to avoid GHA cache errors
        cache: ${{ (hashFiles('package-lock.json') != '' && 'npm') || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm') || (hashFiles('yarn.lock') != '' && 'yarn') || '' }}

    - name: Install dependencies
      if: steps.check-files.outputs.exists == 'true'
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        elif [ -f "pnpm-lock.yaml" ]; then
          npx pnpm i --frozen-lockfile
        elif [ -f "yarn.lock" ]; then
          yarn install --frozen-lockfile
        else
          npm install
        fi

    - name: Build project
      if: steps.check-files.outputs.exists == 'true'
      run: npm run build --if-present

    - name: Run tests
      if: steps.check-files.outputs.exists == 'true'
      run: npm test --if-present
