# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.jules/**'

# Cancel in-progress runs when a new push is made to the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2 # 11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4.2.0 # 1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      with:
        node-version: ${{ matrix.node-version }}
        # Only enable caching if a lockfile exists to prevent CI failure (Bootstrap Guard)
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi
    - name: Build project
      run: npm run build --if-present
    - name: Run tests
      run: npm test
