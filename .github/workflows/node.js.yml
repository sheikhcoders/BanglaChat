# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".jules/**"
      - "**.md"

# Cancel redundant runs to save Actions minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Detect package manifest
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Only enable caching if a lockfile exists to avoid failure in uninitialized repos
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != '' && 'npm' || '' }}
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm ci
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build --if-present
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm test
