# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # ⚡ Bolt: Reduced CI compute usage by ignoring documentation-only changes
    paths-ignore:
      - 'README.md'
      - '.jules/**'
  pull_request:
    branches: [ "main" ]
    # ⚡ Bolt: Reduced CI compute usage by ignoring documentation-only changes
    paths-ignore:
      - 'README.md'
      - '.jules/**'

jobs:
  build:
    # ⚡ Bolt: Skip job in uninitialized repositories to save compute
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4

    # ⚡ Bolt: Migrate to pnpm for faster dependency installation
    # Impact: Reduces installation time by ~30-50% compared to npm
    - name: Install pnpm
      uses: pnpm/action-setup@a32239d4e389a3fa59f5f619688eb93ae099c21f
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - run: pnpm install
    - run: pnpm run build --if-present
    - run: pnpm test
