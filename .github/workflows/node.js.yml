# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    # Optimize: Ignore documentation and journal changes to save CI compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'
  pull_request:
    branches: [ "main" ]
    # Optimize: Ignore documentation and journal changes to save CI compute
    paths-ignore:
      - 'README.md'
      - '.Jules/**'

# Optimize: Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Detect package manager
      id: detect-manager
      run: |
        if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          exit 0
        elif [ -f "${{ github.workspace }}/package.json" ]; then
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=install" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "manager=" >> $GITHUB_OUTPUT
          echo "command=" >> $GITHUB_OUTPUT
          exit 0
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.detect-manager.outputs.manager != '' && steps.detect-manager.outputs.manager || '' }}
    - name: Install dependencies
      if: steps.detect-manager.outputs.manager != ''
      run: ${{ steps.detect-manager.outputs.manager }} ${{ steps.detect-manager.outputs.command }}
    - name: Build
      if: steps.detect-manager.outputs.manager != ''
      run: ${{ steps.detect-manager.outputs.manager }} run build --if-present
    - name: Test
      if: steps.detect-manager.outputs.manager != ''
      run: ${{ steps.detect-manager.outputs.manager }} test
