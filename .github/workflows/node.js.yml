# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

# Sentinel Security Hardening:
# 1. Read-only token permissions (least privilege)
# 2. Execution timeout to prevent runner resource exhaustion
permissions:
  contents: read

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # Pin checkout action to exact 40-character commit SHA to prevent supply chain attacks
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    # Pin setup-node action to exact 40-character commit SHA
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: ${{ matrix.node-version }}

    # Verify package.json existence before running npm CI steps
    - name: Run CI steps if package.json exists
      run: |
        if [ -f "package.json" ]; then
          npm ci
          npm run build --if-present
          npm test
        else
          echo "No package.json found; skipping node CI steps."
        fi
