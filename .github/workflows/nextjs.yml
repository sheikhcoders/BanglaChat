# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.jules/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Enforce global read-only permissions
permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package_json_exists: ${{ steps.check_files.outputs.exists }}
    steps:
      # Pin to actions/checkout@v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Bolt performance optimization: Check package.json before doing setup/install steps to prevent failing in uninitialized state
      - name: Check package.json existence
        id: check_files
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect package manager
        if: steps.check_files.outputs.exists == 'true'
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      # Pin to actions/setup-node@v4.2.0
      - name: Setup Node
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/setup-node@0a44ba7841725637a5499272912a1ef874a5933c
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      # Pin to actions/configure-pages@v5.0.0
      - name: Setup Pages
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/configure-pages@1c435fa1887e98637779fb5537d6e4bde0d12543

      # Pin to actions/cache@v4.2.1
      - name: Restore cache
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/cache@0c907a75c2aa011c10d08502871b090d402a1833
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        if: steps.check_files.outputs.exists == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        if: steps.check_files.outputs.exists == 'true'
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      # Pin to actions/upload-pages-artifact@v3.0.1
      - name: Upload artifact
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dee4366af6d9
        with:
          path: ./out

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: needs.build.outputs.package_json_exists == 'true'
    steps:
      # Pin to actions/deploy-pages@v4.0.5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db9016255d2c114ad1e4fdec5ef0e129792036
