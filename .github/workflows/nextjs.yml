# Sample workflow for building and deploying a Next.js site to GitHub Pages
# Performance optimizations added by Bolt ⚡

name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Bolt: Skip deployment workflows on documentation and agent metadata changes
    paths-ignore:
      - '**.md'
      - '.jules/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # Bolt: Limit job duration to 15 minutes to prevent hung processes from wasting compute time
    timeout-minutes: 15
    outputs:
      manager: ${{ steps.detect-package-manager.outputs.manager }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "No package.json found; skipping Next.js build"
            echo "manager=none" >> $GITHUB_OUTPUT
            echo "command=none" >> $GITHUB_OUTPUT
            echo "runner=none" >> $GITHUB_OUTPUT
            exit 0
          fi
      - name: Setup Node
        if: steps.detect-package-manager.outputs.manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        if: steps.detect-package-manager.outputs.manager != 'none'
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Restore cache
        if: steps.detect-package-manager.outputs.manager != 'none'
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        if: steps.detect-package-manager.outputs.manager != 'none'
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        if: steps.detect-package-manager.outputs.manager != 'none'
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Upload artifact
        if: steps.detect-package-manager.outputs.manager != 'none'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    if: needs.build.outputs.manager != 'none'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
