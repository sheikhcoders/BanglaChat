# Sample workflow for building and deploying a Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.jules/**'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check-manifest.outputs.exists }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for package.json
        id: check-manifest
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::package.json not found. Skipping build."
          fi
      - name: Install pnpm
        if: steps.check-manifest.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        if: steps.check-manifest.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # SENTINEL: Use conditional caching to prevent failure when lockfile is missing
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Setup Pages
        if: steps.check-manifest.outputs.exists == 'true'
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Restore cache
        if: steps.check-manifest.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        if: steps.check-manifest.outputs.exists == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Build with Next.js
        if: steps.check-manifest.outputs.exists == 'true'
        run: pnpm exec next build
      - name: Upload artifact
        if: steps.check-manifest.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.exists == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
