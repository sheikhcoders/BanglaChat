# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # BOLT OPTIMIZATION: Ignore documentation and journal changes to save CI compute resources.
    paths-ignore:
      - 'README.md'
      - '.jules/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_package_json: ${{ steps.check-project.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check if package.json exists
        id: check-project
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Detect package manager
        id: detect-package-manager
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        # BOLT OPTIMIZATION: Skip step if package.json is missing to prevent failures in uninitialized repos.
        if: steps.check-project.outputs.exists == 'true'
        with:
          path: ./out

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # BOLT OPTIMIZATION: Skip job if package.json is missing to prevent failures in uninitialized repos.
    if: needs.build.outputs.has_package_json == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
