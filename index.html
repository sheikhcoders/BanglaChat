<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy (CSP): Prevents XSS and limits script execution strictly to local trusted assets. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self';"
    />
    <title>🇧🇩 বাংলাচ্যাট / BanglaChat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #f1f5f9;
      }
      main {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .chat-log {
        height: 250px;
        overflow-y: auto;
        border: 1px solid #cbd5e1;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        background: #f8fafc;
        /* Performance Optimization (Bolt): Apply CSS containment 'contain: content'. */
        /* This informs the browser's rendering engine that the element's subtree is completely */
        /* independent of the rest of the page. Recalculating style, layout, and paint of messages */
        /* inside the log will never trigger expensive full-document reflows/repaints, confining */
        /* render engine updates locally and significantly improving performance during scroll and message insertions. */
        contain: content;
        overflow-wrap: break-word;
        word-break: break-word;
      }
      .chat-log p {
        margin: 8px 0;
        animation: chatMessageFadeIn 0.25s ease-out;
      }
      @keyframes chatMessageFadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .chat-log:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #059669;
        outline-offset: 2px;
      }
      .quick-replies {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip-btn {
        background: #e2e8f0;
        color: #334155;
        border: 1px solid #cbd5e1;
        padding: 4px 10px;
        border-radius: 16px;
        font-size: 0.8rem;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          transform 0.1s ease;
      }
      .chip-btn:hover {
        background: #cbd5e1;
      }
      .chip-btn:active {
        transform: scale(0.95);
      }
      form {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .input-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .input-field-container {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 36px 10px 10px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
      }
      .clear-btn {
        position: absolute;
        right: 8px;
        background: transparent;
        color: #64748b;
        border: none;
        padding: 4px 8px;
        border-radius: 50%;
        font-size: 0.85rem;
        cursor: pointer;
        line-height: 1;
        transition:
          color 0.15s ease,
          background-color 0.15s ease;
      }
      .clear-btn:hover {
        color: #1e293b;
        background: #e2e8f0;
      }
      .clear-btn:focus-visible {
        outline: 2px solid #059669;
        outline-offset: 1px;
      }
      input:focus {
        border-color: #059669;
      }
      button {
        background: #059669;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition:
          background-color 0.15s ease,
          transform 0.1s ease;
      }
      button:hover {
        background: #047857;
      }
      button:active {
        transform: scale(0.97);
      }
      .char-counter {
        font-size: 0.75rem;
        color: #64748b;
        align-self: flex-start;
        margin-left: 4px;
        transition: color 0.15s ease;
      }
      .char-counter.warning {
        color: #d97706;
        font-weight: 600;
      }
      .char-counter.danger {
        color: #dc2626;
        font-weight: bold;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="text-align: center">
        <span role="img" aria-label="Bangladesh Flag">🇧🇩</span> বাংলাচ্যাট /
        BanglaChat
      </h1>
      <div
        id="log"
        role="log"
        aria-live="polite"
        class="chat-log"
        tabindex="0"
        aria-label="চ্যাট ইতিহাস / Chat history"
      >
        <p>
          <strong>🤖 বট / Bot:</strong> স্বাগতম! নতুন বার্তা পাঠান। / Welcome!
          Please send a message.
        </p>
      </div>
      <div
        class="quick-replies"
        role="group"
        aria-label="দ্রুত উত্তর / Quick replies"
      >
        <button type="button" class="chip-btn" data-msg="হ্যালো! / Hello!">
          👋 হ্যালো / Hello
        </button>
        <button
          type="button"
          class="chip-btn"
          data-msg="কেমন আছেন? / How are you?"
        >
          ❓ কেমন আছেন? / How are you?
        </button>
        <button type="button" class="chip-btn" data-msg="ধন্যবাদ! / Thank you!">
          🙏 ধন্যবাদ / Thank you
        </button>
      </div>
      <form id="frm">
        <div class="input-wrapper">
          <label for="msg" class="sr-only">বার্তা / Message</label>
          <div class="input-field-container">
            <input
              id="msg"
              placeholder="বার্তা লিখুন... / Type a message..."
              required
              autocomplete="off"
              maxlength="500"
              aria-describedby="char-count"
            />
            <button
              type="button"
              id="clear-btn"
              class="clear-btn"
              aria-label="লেখা মুছুন / Clear text"
              hidden
            >
              ✖
            </button>
          </div>
          <div id="char-count" class="char-counter" aria-live="polite">
            ০ / ৫০০ অক্ষর | 0 / 500 characters
          </div>
        </div>
        <button type="submit" aria-label="বার্তা পাঠান / Send message">
          পাঠান / Send
        </button>
      </form>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
